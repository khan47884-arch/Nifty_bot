name: daily
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install yfinance requests pyyaml
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "telegram:
            bot_token: \"$TELEGRAM_BOT_TOKEN\"
            chat_id: \"$TELEGRAM_CHAT_ID\"" > option.yml
          python main.py
