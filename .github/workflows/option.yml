app:
  name: "OPTION BOND - NIFTY/SENSEX [5M/15M] INSTANT"
  version: "7.0 FINAL"

market:
  symbols: ["NIFTY", "SENSEX"]
  entry: "5m"
  trend: "15m"
  candle_info: 15
  trading_hours:
    start: "09:30"
    end: "15:00"

strike_logic:
  NIFTY:
    step: 50
    type: "ATM"
  SENSEX:
    step: 100
    type: "ATM"
  show_ltp: true

patterns:
    - W PATTERN
    - M PATTERN
    - BULLISH FLAG
    - BEARISH FLAG
    - BULLISH PIN BAR
    - BEARISH PIN BAR
    - HAMMER
    - BULLISH ENGULFING
    - BEARISH ENGULFING
    - FALLING WEDGE
    - RISING WEDGE

strategy:
  instant_mode: true
  rsi_min: 52
  ema_filter: 20
  sl: 30
  tgt1: 60
  tgt2: 90
  max_trades_per_day: 2

telegram:
  bot_token: "PUT_YOUR_BOT_TOKEN_HERE"
  chat_id: "PUT_YOUR_CHAT_ID_HERE"
  format: "CLEAN"
  show_strike: true
  show_strike_ltp: true
